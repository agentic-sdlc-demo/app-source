name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Governance sync + drift check
        env:
          GITHUB_TOKEN: ${{ secrets.SDLC_GITHUB_TOKEN }}
        run: |
          bash scripts/sync-governance.sh
          bash scripts/sync-governance.sh --check

  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (verification only — no push, no deploy)
        run: docker build -t tasklist:ci .
      # Actual deploys are a manual step (deploy/deploy.sh) run on the demo
      # host — no self-hosted runner or CI-triggered deploy in this demo.
